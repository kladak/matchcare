services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      MATCHCARE_CORS_ORIGINS: "http://localhost:8080,http://localhost:5173"
    volumes:
      - matchcare-data:/app/data

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  matchcare-data:
